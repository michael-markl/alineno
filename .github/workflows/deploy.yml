name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare artifact
        run: |
          mkdir archive
          cp index.html logo.svg lib.js script.js pdf.worker.min.js style.css archive

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: archive

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
